<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="js/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

    <a-scene mindar-image="imageTargetSrc: assets/targets.mind;" color-space="sRGB"
             renderer="colorManagement: true, physicallyCorrectLights"
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

        <a-assets>
            <img id="card" src="Random.webp" />
            <a-asset-item id="avatarModel" src="assets/Little Man.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-plane color="blue" opacity="0.5" position="0 0.5 0" height="0.552" width="1" rotation="0 0 0"></a-plane>
            <a-entity gltf-model="#avatarModel" scale="0.5 0.5 0.5" position="0 -0.5 0" rotation="0 180 0"></a-entity>

        </a-entity>

    </a-scene>
</body>
</html>
